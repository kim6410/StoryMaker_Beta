dden]{display:none}.archive-modal-shell{width:min(1080px,96vw);max-height:92vh;overflow:hidden;background:#0b172a;border:1px solid #38547e;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.detail-panel{padding:22px;max-height:92vh;overflow:auto}.detail-block{padding:16px;margin-top:12px}.detail-block h3{margin:0 0 12px}.channel-tab{border:1px solid #354b6e;border-radius:9px;background:#172844;color:#dcecff;padding:9px 12px;font-weight:800;cursor:pointer}.channel-tab.active{background:#166b49;border-color:#35d58c}.channel-content{white-space:pre-wrap;line-height:1.7;background:#081326;padding:16px;border-radius:12px;max-height:360px;overflow:auto}.archive-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.archive-section{background:#0e1a30;border:1px solid #263a5e;border-radius:14px;overflow:hidden}.archive-section summary{cursor:pointer;padding:15px;font-weight:800;list-style:none}.archive-section summary::-webkit-details-marker{display:none}.archive-section summary::after{content:'열기';float:right;color:#75edce;font-size:12px}.archive-section[open] summary::after{content:'닫기'}.archive-section-body{padding:0 15px 15px}.image-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.image-grid img,.thumbnail-preview{width:100%;border-radius:9px;display:block}.media-grid audio,.media-grid video,.archive-section video,.archive-section audio{width:100%;margin-top:8px}.download-link,.top a{display:inline-block;background:#172844;color:#dcecff;border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:800;margin-top:9px}.badge{font-size:12px;letter-spacing:2px;color:#68e7ff}.empty,.empty-mini{padding:26px;text-align:center;color:#9cb0cc}body.archive-modal-open{overflow:hidden}@media(max-width:800px){.archive-grid,.archive-sections{grid-template-columns:1fr}.image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-modal{padding:8px}.detail-panel{padding:16px}}

.archive-media-all{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.archive-section-static audio,.archive-section-static video{width:100%;margin-top:10px}.archive-section-static.media-preview-card{min-height:220px}.thumbnail-preview{aspect-ratio:9/16;object-fit:cover;max-height:520px;background:#07101f}.mp4-preview{aspect-ratio:9/16;object-fit:contain;max-height:560px;background:#000}.audio-preview{width:100%}.media-download-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:980px){.channel-tabs{grid-template-columns:repeat(4,minmax(130px,1fr))}}@media(max-width:700px){.channel-tabs{grid-template-columns:repeat(2,minmax(135px,1fr))}.archive-media-all{grid-template-columns:1fr}}

<style id="archive-v1-list-style">
.archive-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat-card{background:#0a1528;border:1px solid #263a5e;border-radius:13px;padding:15px 17px;display:flex;align-items:flex-end;justify-content:space-between}.stat-card strong{font-size:27px;color:#fff}.stat-card span{font-size:13px;color:#9cb0cc}.toolbar select{min-width:120px;padding:12px;border:1px solid #334b72;border-radius:10px;background:#081326;color:#fff}.archive-list-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:0 18px 9px;color:#788aa5;font-size:12px}.archive-grid{display:block;border:1px solid #263a5e;border-radius:15px;overflow:hidden}.archive-card{border:0;border-bottom:1px solid #223552;border-radius:0;padding:14px 16px;display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:15px;align-items:center;background:#0d192d}.archive-card:last-child{border-bottom:0}.archive-card:hover{transform:none;background:#11213a}.archive-thumb{width:82px;height:82px;border-radius:11px;object-fit:cover;background:#07101f;border:1px solid #263a5e}.archive-thumb-placeholder{width:82px;height:82px;border-radius:11px;background:#081326;border:1px solid #263a5e;display:flex;align-items:center;justify-content:center;color:#70809a;font-size:12px}.archive-main{min-width:0}.archive-main .card-head{display:block}.archive-main .card-head h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.archive-main .card-summary{margin:6px 0 4px}.archive-date{font-size:12px;color:#788aa5}.archive-assets{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;max-width:410px}.asset-button{min-width:48px;padding:7px 8px;border-radius:9px;border:1px solid #334b72;background:#172844;color:#c9d8ec;font-size:11px;text-align:center}.asset-button.ready{background:#123d32;border-color:#245f50;color:#7df0bf}.asset-button.waiting{opacity:.42}.archive-assets .detail-button{width:auto;min-width:58px;padding:8px 10px}.archive-card .status-pill{display:inline-block;margin-left:7px;vertical-align:middle}.archive-card .job-id{margin:5px 0 0}.archive-card .asset-row{display:none}@media(max-width:850px){.archive-stats{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.archive-list-head{display:none}.archive-card{grid-template-columns:64px minmax(0,1fr)}.archive-thumb,.archive-thumb-placeholder{width:64px;height:64px}.archive-assets{grid-column:1/-1;justify-content:flex-start;max-width:none;padding-left:79px}}@media(max-width:520px){.archive-assets{padding-left:0}.archive-card{grid-template-columns:1fr}.archive-thumb,.archive-thumb-placeholder{width:100%;height:150px}}

<body>
<header class="top"><strong>보관함 Beta</strong><a href="/beta/production">딸깍 Beta</a></header>
<main class="wrap">
<section class="panel"><div class="badge">BETA CONTENT ARCHIVE</div><h1>Beta 전용 보관함</h1><p class="muted">한 작업 안에서 SNS 8채널, 이미지, MP3, SRT, 썸네일, MP4를 함께 확인합니다. V1 보관함과 데이터는 분리됩니다.</p><div class="archive-stats">
      <div class="stat-card"><strong id="archive-stat-total">0</strong><span>전체 제작</span></div>
      <div class="stat-card"><strong id="archive-stat-completed">0</strong><span>완료</span></div>
      <div class="stat-card"><strong id="archive-stat-mp3">0</strong><span>MP3</span></div>
      <div class="stat-card"><strong id="archive-stat-mp4">0</strong><span>MP4</span></div>
    </div>
    <div class="toolbar">
      <input id="beta-archive-search" placeholder="제목·업체명·지역·작업 ID 검색">
      <select id="beta-archive-filter"><option value="all">전체 상태</option><option value="completed">완료</option><option value="working">진행 중</option><option value="media">미디어 보유</option></select>
      <select id="beta-archive-sort"><option value="newest">최신순</option><option value="oldest">오래된순</option><option value="title">제목순</option></select>
      <button id="beta-archive-refresh" type="button">새로고침</button>
    </div>
    <div class="archive-list-head"><span>제작 결과</span><span>콘텐츠·미디어 상태</span></div>
    <div id="beta-archive-list" class="empty">불러오는 중...</div></section>
<div id="beta-archive-modal" class="archive-modal" hidden><div class="archive-modal-shell"><section id="beta-archive-detail" class="detail-panel"></section></div></div>
</main>
<script src="/beta-static/beta-archive-detail-fix-20260724.js"></script>
